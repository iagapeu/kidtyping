<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>키즈 타자교실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 밝고 친절한 교실 — 아이가 혼자 눌러도 헷갈리지 않게
   IDEA: 교실 칠판 옆에 놓인 커다란 키보드와 손
   PICTURE: 투명한 손이 올라간 키보드가 화면의 주인공
   COLOUR+TYPE: 하늘색 바탕, 진한 파랑 메뉴, 토마토색 강조, 노란 키 / Jua + Noto Sans KR
   LAYOUT: 왼쪽 메뉴, 가운데 연습판, 아래 키보드. 좁으면 메뉴가 위로 */
:root{color-scheme:light dark;
 --bg:light-dark(#EAF4FF,#141B2B);--card:light-dark(#FFFFFF,#1F2940);--ink:light-dark(#1E2A3B,#E8EEF8);
 --sub:light-dark(#5B6678,#A3B0C6);--line:light-dark(#D5E2F2,#33405A);--nav:#2B59C3;--nav2:#1F45A0;
 --acc:#FF6B4A;--yel:#FFD43B;--good:#2F9E44;--bad:#E03131;--blue:#1C7ED6;--soft:light-dark(#F3F8FF,#26324C)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.jua{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:8px 18px;font-weight:700;color:#fff;background:var(--acc)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
button.gray{background:#8A94A6}button.blue{background:var(--blue)}button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:disabled{background:var(--line);color:var(--sub);cursor:default}
input[type=text]{font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;min-height:100vh}
.top{grid-column:1/-1;background:var(--nav);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.top .logo{display:flex;align-items:center;gap:10px;font-size:24px}
.top .greet{color:var(--yel);font-size:20px}
.top .sp{flex:1}
.top .tstat{font-size:14px;opacity:.95;white-space:nowrap}
.top button{background:#9CC0FF;color:#0E2A66;min-height:38px;padding:6px 14px}
nav{background:var(--nav2);padding:8px 0;display:flex;flex-direction:column}
nav a{color:#fff;text-decoration:none;padding:13px 20px;font-size:17px;font-family:Jua,sans-serif;white-space:nowrap}
nav a.on{background:var(--acc)}nav a:hover{background:rgba(255,255,255,.12)}nav a.on:hover{background:var(--acc)}
main{padding:18px clamp(14px,2.4vw,30px) 24px;overflow:auto}
footer{grid-column:1/-1;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:6px 16px;font-size:13px;color:var(--sub);background:var(--soft);border-top:1px solid var(--line)}
footer a{color:var(--blue);font-weight:700;text-decoration:none}
.full{grid-column:1/-1}
h1{font-size:clamp(28px,3.4vw,40px);line-height:1.1;margin:4px 0 6px;text-wrap:balance}
h2{font-size:24px;margin:22px 0 8px}
.lead{color:var(--sub);margin:0 0 14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;color:var(--ink);font-weight:400;min-height:0}
button.card{display:block;width:100%}
button.card:hover{border-color:var(--acc)}
.card .t{font-family:Jua,sans-serif;font-size:21px}
.card .d{color:var(--sub);font-size:14px}
.stars{color:#F59F00;font-size:22px;letter-spacing:2px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 16px}
.stat b{display:block;font-size:12px;color:var(--sub);font-weight:700}
.stat span{font-family:Jua,sans-serif;font-size:28px;white-space:nowrap}
.cont{background:var(--card);border-radius:18px;padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:2px dashed #8DB7FF;margin:14px 0}
.cont .t{font-family:Jua,sans-serif;font-size:24px;flex:1}
/* 프로필 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;max-width:980px;margin:0 auto}
.pcard{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;text-align:center;color:var(--ink);font-weight:400;display:flex;flex-direction:column;align-items:center;gap:4px}
.av{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;color:#fff;font:40px Jua,sans-serif}
.pcard .n{font-family:Jua,sans-serif;font-size:22px}
.pcard .m{font-size:13px;color:var(--sub)}
.mini{font-size:13px;min-height:32px;padding:4px 10px;background:transparent;color:var(--blue)}
.mini.del{color:var(--bad)}
/* 연습 */
.phead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.phead h1{font-size:28px;margin:0;flex:1}
.chip{border-radius:999px;padding:6px 14px;color:#fff;font-weight:700;font-size:14px;white-space:nowrap}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.stats .stat{flex:1 1 110px}
.stage{background:var(--card);border-radius:18px;padding:18px 12px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:2px solid var(--line)}
.seq{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:nowrap;overflow:hidden;max-width:100%}
.seq i{font-style:normal;width:58px;height:58px;flex:none;border-radius:12px;display:grid;place-items:center;font:28px Jua,sans-serif;background:var(--soft);color:var(--sub);border:2px solid var(--line)}
.seq i.done{color:#7AD48A;background:light-dark(#EBFBEE,#1E3A2A);border-color:#B2F2BB}
.seq i.cur{width:92px;height:92px;font-size:48px;background:var(--yel);color:#1E2A3B;border:4px solid var(--acc)}
.line{display:flex;flex-wrap:nowrap;justify-content:center;font:clamp(20px,3.2vw,34px) Jua,"Noto Sans KR",sans-serif;white-space:pre}
.line span{display:inline-block;text-align:left;border-radius:4px}
.tline span.ok{color:var(--good)}.tline span.bad{color:var(--bad)}.tline span.cur{background:var(--yel);color:#1E2A3B}
.yline{background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:4px 14px;min-height:1.6em}
.yline span.ok{color:var(--blue)}.yline span.bad{color:var(--bad);background:#FFC9C9}.yline span.comp{text-decoration:underline}
.yline .caret{display:inline-block;width:3px;background:var(--acc);height:1.1em;vertical-align:-.15em;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.yline .caret{animation:none}}
.next{color:var(--sub);font-size:15px}
.hint{text-align:center;font-weight:700;color:#4263EB;margin:10px 0 6px;min-height:1.5em}
.hint.bad{color:var(--bad)}.hint.good{color:var(--good)}
.kbwrap{display:flex;justify-content:center}
#kb{display:block;touch-action:manipulation}
/* 결과 */
.modal{position:fixed;inset:0;background:rgba(10,20,40,.45);display:grid;place-items:center;z-index:20;padding:16px}
.box{background:var(--card);border-radius:24px;padding:26px 30px;text-align:center;max-width:520px;width:100%;border:4px solid var(--acc)}
.box h2{margin:0;font-size:32px;color:var(--acc)}
.box .stars{font-size:52px}
.box .row{justify-content:center;margin-top:14px}
.small{font-size:12px;color:var(--sub)}
/* 게임 */
.gcanvas{width:100%;border-radius:18px;display:block;background:#D0EBFF}
.lv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.lv button{min-height:44px;padding:4px;color:#1E2A3B;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.lv button small{color:#B26B00;font-size:11px}
.seg{display:inline-flex;border-radius:12px;overflow:hidden;border:2px solid var(--line)}
.seg button{border-radius:0;background:var(--card);color:var(--ink)}
.seg button.on{background:var(--acc);color:#fff}
/* 기록 */
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:180px;background:var(--card);border-radius:16px;padding:14px;border:2px solid var(--line)}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--sub)}
.bars i{display:block;width:70%;background:#74C0FC;border-radius:6px 6px 0 0;min-height:2px}
.bars div.today i{background:var(--acc)}
table{border-collapse:collapse;width:100%;background:var(--card);border-radius:14px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n{text-align:right;white-space:nowrap}
.two{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:22px}
.books .card{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.books .card .t{flex:1}
label.chk{display:flex;gap:10px;align-items:center;font-size:17px;margin:8px 0;cursor:pointer}
label.chk input{width:22px;height:22px}
textarea{width:100%;min-height:90px;font:13px monospace;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:8px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:40px;height:40px;min-height:40px;border-radius:50%;padding:0}
.colors button.on{outline:4px solid var(--ink);outline-offset:2px}
@media(max-width:820px){
 .app{grid-template-columns:minmax(0,1fr)}
 nav{flex-direction:row;overflow-x:auto;padding:0}
 nav a{padding:10px 14px;font-size:15px}
 .two{grid-template-columns:minmax(0,1fr)}
 .top .tstat{display:none}
 .phead h1{flex:1 1 100%;order:-1}
 nav a{flex:none}
}
@media(max-width:600px){.seq i{width:42px;height:42px;font-size:20px}.seq i.cur{width:70px;height:70px;font-size:36px}.stats .stat span{font-size:22px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="modal"></div>
<script>
{
/* ===================================================== 한글 엔진 (두벌식) */
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ",JUNG="ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
const JONG=["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const VC={"ㅗㅏ":"ㅘ","ㅗㅐ":"ㅙ","ㅗㅣ":"ㅚ","ㅜㅓ":"ㅝ","ㅜㅔ":"ㅞ","ㅜㅣ":"ㅟ","ㅡㅣ":"ㅢ"};
const JC={"ㄱㅅ":"ㄳ","ㄴㅈ":"ㄵ","ㄴㅎ":"ㄶ","ㄹㄱ":"ㄺ","ㄹㅁ":"ㄻ","ㄹㅂ":"ㄼ","ㄹㅅ":"ㄽ","ㄹㅌ":"ㄾ","ㄹㅍ":"ㄿ","ㄹㅎ":"ㅀ","ㅂㅅ":"ㅄ"};
const VS={},JSP={};for(const k in VC)VS[VC[k]]=[k[0],k[1]];for(const k in JC)JSP[JC[k]]=[k[0],k[1]];
const K2J={q:"ㅂ",w:"ㅈ",e:"ㄷ",r:"ㄱ",t:"ㅅ",y:"ㅛ",u:"ㅕ",i:"ㅑ",o:"ㅐ",p:"ㅔ",a:"ㅁ",s:"ㄴ",d:"ㅇ",f:"ㄹ",g:"ㅎ",h:"ㅗ",j:"ㅓ",k:"ㅏ",l:"ㅣ",z:"ㅋ",x:"ㅌ",c:"ㅊ",v:"ㅍ",b:"ㅠ",n:"ㅜ",m:"ㅡ",Q:"ㅃ",W:"ㅉ",E:"ㄸ",R:"ㄲ",T:"ㅆ",O:"ㅒ",P:"ㅖ"};
const J2K={};for(const k in K2J)J2K[K2J[k]]=[k.toLowerCase(),k!==k.toLowerCase()];
const isCon=c=>CHO.includes(c),isVow=c=>JUNG.includes(c),isJamo=c=>c in J2K;
const hasHangul=s=>/[\uAC00-\uD7A3\u3131-\u318E]/.test(s);
function keyToJamo(l,sh){return (sh&&K2J[l.toUpperCase()])||K2J[l.toLowerCase()]||null}
function mk(c,v,j){if(c&&v)return String.fromCharCode(0xAC00+(CHO.indexOf(c)*21+JUNG.indexOf(v))*28+JONG.indexOf(j||""));return c||v||""}
function compose(toks){
 const out=[];let c=null,v=null,j=null;
 const flush=()=>{const s=mk(c,v,j);if(s)out.push(s);c=v=j=null};
 for(const t of toks){
  if(isCon(t)){
   if(!c&&!v)c=t;
   else if(!v||!c){flush();c=t}
   else if(!j){if("ㄸㅃㅉ".includes(t)){flush();c=t}else j=t}
   else{const cb=JC[j+t];if(cb)j=cb;else{flush();c=t}}
  }else if(isVow(t)){
   if(!c&&!v)v=t;
   else if(!v)v=t;
   else if(!j){const cb=VC[v+t];if(cb)v=cb;else{flush();v=t}}
   else{let mv;if(JSP[j]){mv=JSP[j][1];j=JSP[j][0]}else{mv=j;j=null}flush();c=mv;v=t}
  }else{flush();out.push(t)}
 }
 flush();return out.join("");
}
function decompose(s){
 const r=[];
 for(const ch of s){
  const o=ch.charCodeAt(0);
  if(o>=0xAC00&&o<=0xD7A3){const x=o-0xAC00;r.push(CHO[Math.floor(x/588)]);const v=JUNG[Math.floor(x%588/28)];r.push(...(VS[v]||[v]));const j=JONG[x%28];if(j)r.push(...(JSP[j]||[j]))}
  else if(VS[ch])r.push(...VS[ch]);else if(JSP[ch])r.push(...JSP[ch]);else r.push(ch);
 }
 return r;
}
const SHIFT_SYM={"~":"`","!":"1","@":"2","#":"3","$":"4","%":"5","^":"6","&":"7","*":"8","(":"9",")":"0","_":"-","+":"=","{":"[","}":"]","|":"\\",":":";",'"':"'","<":",",">":".","?":"/"};
function keyFor(t){
 if(t==null)return[null,false];if(J2K[t])return J2K[t];if(t===" ")return["space",false];
 if(/^[a-zA-Z]$/.test(t))return[t.toLowerCase(),t!==t.toLowerCase()];
 if(SHIFT_SYM[t])return[SHIFT_SYM[t],true];return[t,false];
}

/* ===================================================== 연습 자료 */
const W=s=>s.split(" ");
const KO_KEYS=[
 {id:"ko_home_l",title:"왼손 중간줄",desc:"ㅁ ㄴ ㅇ ㄹ ㅎ (A S D F G)",keys:"ㅁㄴㅇㄹㅎ",review:""},
 {id:"ko_home_r",title:"오른손 중간줄",desc:"ㅗ ㅓ ㅏ ㅣ (H J K L)",keys:"ㅗㅓㅏㅣ",review:"ㅁㄴㅇㄹ"},
 {id:"ko_top_l",title:"왼손 윗줄",desc:"ㅂ ㅈ ㄷ ㄱ ㅅ (Q W E R T)",keys:"ㅂㅈㄷㄱㅅ",review:"ㅁㄴㅇㄹㅎ"},
 {id:"ko_top_r",title:"오른손 윗줄",desc:"ㅛ ㅕ ㅑ ㅐ ㅔ (Y U I O P)",keys:"ㅛㅕㅑㅐㅔ",review:"ㅗㅓㅏㅣ"},
 {id:"ko_bot_l",title:"왼손 아랫줄",desc:"ㅋ ㅌ ㅊ ㅍ ㅠ (Z X C V B)",keys:"ㅋㅌㅊㅍㅠ",review:"ㅁㄴㅇㄹ"},
 {id:"ko_bot_r",title:"오른손 아랫줄",desc:"ㅜ ㅡ (N M)",keys:"ㅜㅡ",review:"ㅗㅓㅏㅣㅠ"},
 {id:"ko_shift",title:"쌍자음 · 쌍모음",desc:"Shift + ㄲ ㄸ ㅃ ㅆ ㅉ ㅒ ㅖ",keys:"ㄲㄸㅃㅆㅉㅒㅖ",review:""},
 {id:"ko_all",title:"모든 자리 섞기",desc:"지금까지 배운 자리 모두",keys:"ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔㅁㄴㅇㄹㅎㅗㅓㅏㅣㅋㅌㅊㅍㅠㅜㅡ",review:""}];
const KO_SENT=["안녕하세요.","나는 학교에 가요.","엄마 사랑해요.","아빠 고마워요.","오늘은 날씨가 맑아요.","강아지가 멍멍 짖어요.","고양이가 야옹 울어요.","친구와 함께 놀아요.","나는 책 읽기를 좋아해요.","밥을 맛있게 먹어요.","손을 깨끗이 씻어요.","하늘에 구름이 둥둥 떠 있어요.","바다에는 물고기가 많아요.","우리 가족은 모두 다섯 명이에요.","내일은 공원에 갈 거예요.","선생님 말씀을 잘 들어요.","동생과 사이좋게 지내요.","꽃밭에 나비가 날아요.","비가 오면 우산을 써요.","자기 전에 이를 닦아요.","나는 그림 그리기를 좋아해요.","토끼는 깡충깡충 뛰어요.","달님이 환하게 웃어요.","아침에 일찍 일어나요.","도서관에서는 조용히 해요.","줄을 서서 차례를 지켜요.","고맙습니다, 사랑합니다.","열심히 연습하면 잘할 수 있어요.","타자 연습은 정말 재미있어요.","천천히, 바르게 치는 것이 중요해요."];
const KO_TEXT=[
 {id:"ko_vowel",title:"모음 조합",desc:"아 야 어 여 오 요 우 유 으 이 애 에",items:W("아 야 어 여 오 요 우 유 으 이 애 에 얘 예")},
 {id:"ko_vowel2",title:"겹모음 조합",desc:"와 워 위 외 의 왜 웨",items:W("와 워 위 외 의 왜 웨 과 귀 뇌 뭐 쥐 회 화 희")},
 {id:"ko_syll",title:"가나다 글자",desc:"가 나 다 라 마 바 사 ...",items:["가 나 다 라","마 바 사 아","자 차 카 타","파 하 가 나","고 노 도 로","모 보 소 오","조 초 코 토","포 호 구 누","두 루 무 부","수 우 주 추","기 니 디 리","미 비 시 이"]},

const CODE_CH={Minus:["-","_"],Equal:["=","+"],BracketLeft:["[","{"],BracketRight:["]","}"],Backslash:["\\","|"],Semicolon:[";",":"],Quote:["'",'"'],Comma:[",","<"],Period:[".",">"],Slash:["/","?"],Backquote:["`","~"]};

function parseKey(e){
 const c=e.code||"";
 if(c==="Backspace")return["back"];if(c==="Enter"||c==="NumpadEnter")return["enter"];if(c==="Escape")return["esc"];
 if(c==="Lang1"||c==="HangulMode"||e.key==="HangulMode"||c==="AltRight")return["toggle"];
 if(e.ctrlKey||e.metaKey)return null;
 const sh=e.shiftKey;
 if(/^Key[A-Z]$/.test(c))return["letter",c[3].toLowerCase(),sh];
 if(c==="Space")return["char"," "];
 if(/^Digit\d$/.test(c))return["char",sh?DIG_SH[+c[5]]:c[5]];
 if(CODE_CH[c])return["char",CODE_CH[c][sh?1:0]];
 const k=e.key||"";if(k.length===1){if(isJamo(k))return["jamo",k];if(/[a-zA-Z]/.test(k))return["letter",k.toLowerCase(),sh];if(k===" ")return["char"," "];if(k.charCodeAt(0)<127)return["char",k]}

}

function splitLines(text){
 const R={"“":'"',"”":'"',"‘":"'","’":"'","…":"...","·":",","–":"-","—":"-","\t":" ","\u3000":" ","\xa0":" ","～":"~","！":"!","？":"?","，":",","．":"."};
 const out=[];
 for(let p of text.split(/\r?\n/)){
  p=[...p].map(c=>R[c]??c).filter(c=>{const o=c.charCodeAt(0);return(o>=0xAC00&&o<=0xD7A3)||isJamo(c)||(o>=32&&o<=126)}).join("").replace(/\s+/g," ").trim();
  if(!p)continue;
  for(let s of p.split(/(?<=[.!?])\s+/)){s=s.trim();if(!s)continue;const mx=hasHangul(s)?26:46;
   while(s.length>mx){let cut=s.lastIndexOf(" ",mx);if(cut<=0)cut=mx;out.push(s.slice(0,cut).trim());s=s.slice(cut).trim()}if(s)out.push(s)}
 }

}

let ticks=0;
setInterval(()=>{const p=P();if(p&&document.visibilityState==="visible"&&Date.now()-lastAct<60000){p.total_sec++;const d=today();p.daily[d]=(p.daily[d]||0)+1;if(++ticks%15===0){save();topStat()}}},1000);
window.addEventListener("pagehide",save);
go("profiles");
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(view==="practice"||view==="game")window.dispatchEvent(new Event("resize"))});
connectDB();
}
</script>
